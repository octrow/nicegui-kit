name: Bug report
description: Something in the kit renders or behaves wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      description: A short NiceGUI page is ideal. A screenshot helps for visual bugs.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: nicegui-kit 0.1.1, nicegui 3.15, Python 3.12, Firefox 140 on Linux
    validations:
      required: true
