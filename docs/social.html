<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url("../src/nicegui_kit/assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #12181c; font-family: Inter, sans-serif; color: #e6edf0; }
.wrap { display: grid; grid-template-columns: 470px 1fr; height: 100%; align-items: center; }

.tags { font-size: 20px; color: #7fd0e3; font-weight: 600; }
.shot { height: 100%; display: flex; align-items: center; overflow: hidden; }
.shot img { width: 900px; border-radius: 14px 0 0 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 1px solid #2a353b; border-right: 0; }

<body><div class="wrap">
  <div class="text">
    <h1>nicegui-kit</h1>
    <p>Theme and toolkit for NiceGUI apps that run jobs: WCAG AA light/dark theme, layout helpers, subprocess pool with a live log.</p>
    <div class="tags">pip install nicegui-kit</div>
  </div>
  <div class="shot"><img src="images/runs-dark.png" alt=""></div>
