<svg xmlns="http://www.w3.org/2000/svg" width="600" height="950" viewBox="0 0 600 950" role="img" aria-labelledby="t d">
<title id="t">How a run flows through nicegui-kit</title>
<desc id="d">Your page calls run_pool.submit with an argv list; the pool runs up to 3 subprocesses and queues up to 20; each output line goes to on_line; the run monitor polls every second and updates its widgets in place.</desc>
<rect width="600" height="950" rx="16" fill="#13191B"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="32" y="32" width="536" height="166" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="48" y="72" font-size="24" font-weight="650" fill="#E4EAEC">Your page</text><text x="48" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">submit(argv)</text><text x="48" y="142" font-size="20" fill="#AEB9BC">a button or a timer</text><text x="48" y="172" font-size="20" fill="#AEB9BC">decides what to run</text><path d="M300.0 202 v30" stroke="#5FB8CF" stroke-width="3"/><path d="M300.0 239 l-9 -12 h18 z" fill="#5FB8CF"/><rect x="32" y="242" width="536" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="48" y="282" font-size="24" font-weight="650" fill="#E4EAEC">Run pool</text><text x="48" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">run_pool</text><text x="48" y="352" font-size="20" fill="#AEB9BC">3 running at once,</text><text x="48" y="382" font-size="20" fill="#AEB9BC">20 queued at most,</text><text x="48" y="412" font-size="20" fill="#AEB9BC">cancel kills the process</text><path d="M300.0 442 v30" stroke="#5FB8CF" stroke-width="3"/><path d="M300.0 479 l-9 -12 h18 z" fill="#5FB8CF"/><rect x="32" y="482" width="536" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="48" y="522" font-size="24" font-weight="650" fill="#E4EAEC">Subprocess</text><text x="48" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">on_line(line)</text><text x="48" y="592" font-size="20" fill="#AEB9BC">no shell, argv as a list,</text><text x="48" y="622" font-size="20" fill="#AEB9BC">stdout + stderr merged,</text><text x="48" y="652" font-size="20" fill="#AEB9BC">lines up to 1 MiB</text><path d="M300.0 682 v30" stroke="#5FB8CF" stroke-width="3"/><path d="M300.0 719 l-9 -12 h18 z" fill="#5FB8CF"/><rect x="32" y="722" width="536" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="48" y="762" font-size="24" font-weight="650" fill="#E4EAEC">Run monitor</text><text x="48" y="794" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">attach_run_monitor()</text><text x="48" y="832" font-size="20" fill="#AEB9BC">polls once a second,</text><text x="48" y="862" font-size="20" fill="#AEB9BC">edits widgets in place,</text><text x="48" y="892" font-size="20" fill="#AEB9BC">so scroll stays put</text></g>
</svg>
