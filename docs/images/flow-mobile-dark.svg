<svg xmlns="http://www.w3.org/2000/svg" width="520" height="934" viewBox="0 0 520 934" role="img" aria-labelledby="t d">
<title id="t">How a run flows through nicegui-kit</title>
<desc id="d">Your page calls run_pool.submit with an argv list; the pool runs up to 3 subprocesses and queues up to 20; each output line goes to on_line; the run monitor polls every second and updates its widgets in place.</desc>
<rect width="520" height="934" rx="16" fill="#13191B"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="24" y="24" width="472" height="166" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="40" y="64" font-size="24" font-weight="650" fill="#E4EAEC">Your page</text><text x="40" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">submit(argv)</text><text x="40" y="134" font-size="20" fill="#AEB9BC">a button or a timer</text><text x="40" y="164" font-size="20" fill="#AEB9BC">decides what to run</text><path d="M260.0 194 v30" stroke="#5FB8CF" stroke-width="3"/><path d="M260.0 231 l-9 -12 h18 z" fill="#5FB8CF"/><rect x="24" y="234" width="472" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="40" y="274" font-size="24" font-weight="650" fill="#E4EAEC">Run pool</text><text x="40" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">run_pool</text><text x="40" y="344" font-size="20" fill="#AEB9BC">3 running at once,</text><text x="40" y="374" font-size="20" fill="#AEB9BC">20 queued at most,</text><text x="40" y="404" font-size="20" fill="#AEB9BC">cancel kills the process</text><path d="M260.0 434 v30" stroke="#5FB8CF" stroke-width="3"/><path d="M260.0 471 l-9 -12 h18 z" fill="#5FB8CF"/><rect x="24" y="474" width="472" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="40" y="514" font-size="24" font-weight="650" fill="#E4EAEC">Subprocess</text><text x="40" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">on_line(line)</text><text x="40" y="584" font-size="20" fill="#AEB9BC">no shell, argv as a list,</text><text x="40" y="614" font-size="20" fill="#AEB9BC">stdout + stderr merged,</text><text x="40" y="644" font-size="20" fill="#AEB9BC">lines up to 1 MiB</text><path d="M260.0 674 v30" stroke="#5FB8CF" stroke-width="3"/><path d="M260.0 711 l-9 -12 h18 z" fill="#5FB8CF"/><rect x="24" y="714" width="472" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="40" y="754" font-size="24" font-weight="650" fill="#E4EAEC">Run monitor</text><text x="40" y="786" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">attach_run_monitor()</text><text x="40" y="824" font-size="20" fill="#AEB9BC">polls once a second,</text><text x="40" y="854" font-size="20" fill="#AEB9BC">edits widgets in place,</text><text x="40" y="884" font-size="20" fill="#AEB9BC">so scroll stays put</text></g>
</svg>
