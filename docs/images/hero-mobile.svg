<text x="32" y="158" font-size="24" fill="#535D60">A light and dark theme, layout helpers</text><text x="32" y="188" font-size="24" fill="#535D60">and a subprocess pool with a live log</text><text x="32" y="218" font-size="24" fill="#535D60">for NiceGUI tools that run jobs.</text>
