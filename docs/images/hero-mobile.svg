<title id="t">nicegui-kit</title>
<desc id="d">The same run list drawn with the kit's light tokens on top and its dark tokens below. 37 text/background pairs per theme, tested at WCAG AA · lowest 4.67:1 light, 5.20:1 dark.</desc>
