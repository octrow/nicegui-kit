<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="308" viewBox="0 0 1200 308" role="img" aria-labelledby="t d">
<title id="t">How a run flows through nicegui-kit</title>
<desc id="d">Your page calls run_pool.submit with an argv list; the pool runs up to 3 subprocesses and queues up to 20; each output line goes to on_line; the run monitor polls every second and updates its widgets in place.</desc>
<rect width="1200" height="308" rx="16" fill="#13191B"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="64.0" y="56" width="248.5" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="80.0" y="96" font-size="24" font-weight="650" fill="#E4EAEC">Your page</text><text x="80.0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">submit(argv)</text><text x="80.0" y="166" font-size="20" fill="#AEB9BC">a button or a timer</text><text x="80.0" y="196" font-size="20" fill="#AEB9BC">decides what to run</text><rect x="338.5" y="56" width="248.5" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="354.5" y="96" font-size="24" font-weight="650" fill="#E4EAEC">Run pool</text><text x="354.5" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">run_pool</text><text x="354.5" y="166" font-size="20" fill="#AEB9BC">3 running at once,</text><text x="354.5" y="196" font-size="20" fill="#AEB9BC">20 queued at most,</text><text x="354.5" y="226" font-size="20" fill="#AEB9BC">cancel kills the process</text><path d="M316.5 154.0 h12" stroke="#5FB8CF" stroke-width="3"/><path d="M335.5 154.0 l-12 -9 v18 z" fill="#5FB8CF"/><rect x="613.0" y="56" width="248.5" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="629.0" y="96" font-size="24" font-weight="650" fill="#E4EAEC">Subprocess</text><text x="629.0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">on_line(line)</text><text x="629.0" y="166" font-size="20" fill="#AEB9BC">no shell, argv as a list,</text><text x="629.0" y="196" font-size="20" fill="#AEB9BC">stdout + stderr merged,</text><text x="629.0" y="226" font-size="20" fill="#AEB9BC">lines up to 1 MiB</text><path d="M591.0 154.0 h12" stroke="#5FB8CF" stroke-width="3"/><path d="M610.0 154.0 l-12 -9 v18 z" fill="#5FB8CF"/><rect x="887.5" y="56" width="248.5" height="196" rx="8" fill="#1B2326" stroke="#3D4A4F"/><text x="903.5" y="96" font-size="24" font-weight="650" fill="#E4EAEC">Run monitor</text><text x="903.5" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7CC8DC">attach_run_monitor()</text><text x="903.5" y="166" font-size="20" fill="#AEB9BC">polls once a second,</text><text x="903.5" y="196" font-size="20" fill="#AEB9BC">edits widgets in place,</text><text x="903.5" y="226" font-size="20" fill="#AEB9BC">so scroll stays put</text><path d="M865.5 154.0 h12" stroke="#5FB8CF" stroke-width="3"/><path d="M884.5 154.0 l-12 -9 v18 z" fill="#5FB8CF"/></g>
</svg>
