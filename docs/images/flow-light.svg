<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="308" viewBox="0 0 1200 308" role="img" aria-labelledby="t d">
<title id="t">How a run flows through nicegui-kit</title>
<desc id="d">Your page calls run_pool.submit with an argv list; the pool runs up to 3 subprocesses and queues up to 20; each output line goes to on_line; the run monitor polls every second and updates its widgets in place.</desc>
<rect width="1200" height="308" rx="16" fill="#F3F6F8"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="64.0" y="56" width="248.5" height="196" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="80.0" y="96" font-size="24" font-weight="650" fill="#262E31">Your page</text><text x="80.0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">submit(argv)</text><text x="80.0" y="166" font-size="20" fill="#535D60">a button or a timer</text><text x="80.0" y="196" font-size="20" fill="#535D60">decides what to run</text><rect x="338.5" y="56" width="248.5" height="196" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="354.5" y="96" font-size="24" font-weight="650" fill="#262E31">Run pool</text><text x="354.5" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">run_pool</text><text x="354.5" y="166" font-size="20" fill="#535D60">3 running at once,</text><text x="354.5" y="196" font-size="20" fill="#535D60">20 queued at most,</text><text x="354.5" y="226" font-size="20" fill="#535D60">cancel kills the process</text><path d="M316.5 154.0 h12" stroke="#20758C" stroke-width="3"/><path d="M335.5 154.0 l-12 -9 v18 z" fill="#20758C"/><rect x="613.0" y="56" width="248.5" height="196" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="629.0" y="96" font-size="24" font-weight="650" fill="#262E31">Subprocess</text><text x="629.0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">on_line(line)</text><text x="629.0" y="166" font-size="20" fill="#535D60">no shell, argv as a list,</text><text x="629.0" y="196" font-size="20" fill="#535D60">stdout + stderr merged,</text><text x="629.0" y="226" font-size="20" fill="#535D60">lines up to 1 MiB</text><path d="M591.0 154.0 h12" stroke="#20758C" stroke-width="3"/><path d="M610.0 154.0 l-12 -9 v18 z" fill="#20758C"/><rect x="887.5" y="56" width="248.5" height="196" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="903.5" y="96" font-size="24" font-weight="650" fill="#262E31">Run monitor</text><text x="903.5" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">attach_run_monitor()</text><text x="903.5" y="166" font-size="20" fill="#535D60">polls once a second,</text><text x="903.5" y="196" font-size="20" fill="#535D60">edits widgets in place,</text><text x="903.5" y="226" font-size="20" fill="#535D60">so scroll stays put</text><path d="M865.5 154.0 h12" stroke="#20758C" stroke-width="3"/><path d="M884.5 154.0 l-12 -9 v18 z" fill="#20758C"/></g>
</svg>
