<svg xmlns="http://www.w3.org/2000/svg" width="520" height="934" viewBox="0 0 520 934" role="img" aria-labelledby="t d">
<title id="t">How a run flows through nicegui-kit</title>
<desc id="d">Your page calls run_pool.submit with an argv list; the pool runs up to 3 subprocesses and queues up to 20; each output line goes to on_line; the run monitor polls every second and updates its widgets in place.</desc>
<rect width="520" height="934" rx="16" fill="#F3F6F8"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><rect x="24" y="24" width="472" height="166" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="40" y="64" font-size="24" font-weight="650" fill="#262E31">Your page</text><text x="40" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">submit(argv)</text><text x="40" y="134" font-size="20" fill="#535D60">a button or a timer</text><text x="40" y="164" font-size="20" fill="#535D60">decides what to run</text><path d="M260.0 194 v30" stroke="#20758C" stroke-width="3"/><path d="M260.0 231 l-9 -12 h18 z" fill="#20758C"/><rect x="24" y="234" width="472" height="196" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="40" y="274" font-size="24" font-weight="650" fill="#262E31">Run pool</text><text x="40" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">run_pool</text><text x="40" y="344" font-size="20" fill="#535D60">3 running at once,</text><text x="40" y="374" font-size="20" fill="#535D60">20 queued at most,</text><text x="40" y="404" font-size="20" fill="#535D60">cancel kills the process</text><path d="M260.0 434 v30" stroke="#20758C" stroke-width="3"/><path d="M260.0 471 l-9 -12 h18 z" fill="#20758C"/><rect x="24" y="474" width="472" height="196" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="40" y="514" font-size="24" font-weight="650" fill="#262E31">Subprocess</text><text x="40" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">on_line(line)</text><text x="40" y="584" font-size="20" fill="#535D60">no shell, argv as a list,</text><text x="40" y="614" font-size="20" fill="#535D60">stdout + stderr merged,</text><text x="40" y="644" font-size="20" fill="#535D60">lines up to 1 MiB</text><path d="M260.0 674 v30" stroke="#20758C" stroke-width="3"/><path d="M260.0 711 l-9 -12 h18 z" fill="#20758C"/><rect x="24" y="714" width="472" height="196" rx="8" fill="#FFFFFF" stroke="#C6CED0"/><text x="40" y="754" font-size="24" font-weight="650" fill="#262E31">Run monitor</text><text x="40" y="786" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#0A6175">attach_run_monitor()</text><text x="40" y="824" font-size="20" fill="#535D60">polls once a second,</text><text x="40" y="854" font-size="20" fill="#535D60">edits widgets in place,</text><text x="40" y="884" font-size="20" fill="#535D60">so scroll stays put</text></g>
</svg>
